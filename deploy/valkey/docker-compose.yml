services:
  valkey:
    image: valkey/valkey:8-alpine
    container_name: momentai-valkey
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?Set VALKEY_PASSWORD in .env}
    command:
      - sh
      - -c
      - >-
        exec valkey-server --appendonly yes --appendfsync everysec
        --requirepass "$$VALKEY_PASSWORD" --bind 0.0.0.0 --protected-mode yes
    # Bind only to the Droplet's VPC address. Never replace this with 0.0.0.0.
    ports:
      - "${VALKEY_PRIVATE_IP:?Set VALKEY_PRIVATE_IP in .env}:6379:6379"
    volumes:
      - valkey_data:/data
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  valkey_data:
