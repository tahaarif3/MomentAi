version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: momentai-redis
    # Persist BullMQ jobs between restarts without exposing Redis publicly.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
