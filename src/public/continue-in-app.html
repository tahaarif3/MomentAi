<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Continue in the MomentAI app</title>
  <meta name="apple-itunes-app" content="app-id=PLACEHOLDER" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: "Space Grotesk", system-ui, sans-serif; color: #ece5da;
      background: linear-gradient(165deg, #17110c, #2a1f16); padding: 2rem; text-align: center;
    }
    .brand { font-family: "Space Mono", monospace; color: #e9a94f; letter-spacing: 0.1em; text-transform: uppercase; }
    h1 { font-size: 2rem; margin: 12px 0; }
    p { color: #9a8f80; max-width: 28rem; }
    a.btn {
      display: inline-block; margin-top: 20px; padding: 14px 20px; border-radius: 999px;
      background: #e9a94f; color: #17110c; font-weight: 700; text-decoration: none;
    }
    a.secondary { color: #e9a94f; display: inline-block; margin-top: 16px; }
  </style>
</head>
<body>
  <main>
    <p class="brand">MomentAI</p>
    <h1>Continue in the app</h1>
    <p>Playlist generation now lives in the MomentAI mobile app. Download it to capture a moment and open playlists anywhere.</p>
    <a class="btn" href="https://apps.apple.com/">Get the app</a>
    <div><a class="secondary" href="/">Back to momentai.dev</a></div>
  </main>
  <script>
    // Prefer custom scheme when installed
    try {
      const deep = 'momentai://' + (location.pathname.replace(/^\//, '') || 'home');
      setTimeout(() => { window.location.href = deep; }, 400);
    } catch (_) {}
  </script>
</body>
</html>
